<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-label="Palm-leaf manuscript illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#641E32"/>
      <stop offset="1" stop-color="#4A1524"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D6A8"/>
      <stop offset="1" stop-color="#CFB37A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.3" fill="#C5A15A" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#dots)"/>
  <g transform="translate(300 380) rotate(-8)">
    <!-- three stacked palm leaves -->
    <g transform="translate(0 -150)">
      <rect x="-250" y="-34" width="500" height="68" rx="34" fill="url(#leaf)" opacity="0.75"/>
    </g>
    <g transform="translate(14 -60)">
      <rect x="-250" y="-34" width="500" height="68" rx="34" fill="url(#leaf)" opacity="0.88"/>
    </g>
    <g transform="translate(0 30)">
      <rect x="-250" y="-38" width="500" height="76" rx="38" fill="url(#leaf)"/>
      <!-- incised writing lines -->
      <g stroke="#5A3A22" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
        <path d="M-205 -18 h120 M-70 -18 h90 M35 -18 h150"/>
        <path d="M-210 -2 h70 M-125 -2 h140 M30 -2 h170"/>
        <path d="M-205 14 h160 M-30 14 h60 M45 14 h135"/>
      </g>
      <circle cx="-120" cy="0" r="7" fill="#4A1524"/>
      <circle cx="120" cy="0" r="7" fill="#4A1524"/>
    </g>
    <!-- binding string -->
    <path d="M-120 -190 C-130 -60 -112 60 -150 170" fill="none" stroke="#C5A15A" stroke-width="3"/>
    <path d="M120 -190 C130 -60 112 60 150 170" fill="none" stroke="#C5A15A" stroke-width="3"/>
    <!-- wooden covers -->
    <rect x="-262" y="80" width="524" height="30" rx="10" fill="#3A1B12" opacity="0.9"/>
    <rect x="-262" y="-222" width="524" height="26" rx="10" fill="#3A1B12" opacity="0.6"/>
  </g>
</svg>
